name: Gazete Bulmaca Izgara Duzeltmesi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  duzelt:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Iki cengel ve capraz gorunumunu duzelt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          components = Path('lib/newspaper_components.dart')
          s = components.read_text(encoding='utf-8')
          begin = 'List<List<(int, int, int)>> arrowPanelRows(List<WordEntry> words) {'
          end = '\nclass ArrowPaperGrid extends StatelessWidget {'
          assert s.count(begin) == 1 and s.count(end) == 1, 'newspaper_components.dart yapisi degismis'
          start = s.index(begin)
          finish = s.index(end, start)
          replacement = '''// Gazete tipi: her harf, soru ve kapali alan bir hucre.
          List<List<(int, int, int)>> arrowPanelRows(List<WordEntry> words) {
            return List.generate(
              arrowRows,
              (r) => List.generate(arrowSize, (c) => (c, 1, c)),
            );
          }
          '''
          s = s[:start] + replacement + s[finish:]
          components.write_text(s, encoding='utf-8')

          ui = Path('lib/newspaper_ui.dart')
          s = ui.read_text(encoding='utf-8')
          old = "if (widget.free && !has) return SizedBox(key: ValueKey('free_gap_$r,$c'));"
          new = '''if (widget.free && !has) {
              return Container(
                key: ValueKey('free_gap_$r,$c'),
                decoration: BoxDecoration(
                  color: ink,
                  border: Border.all(color: rule, width: .35),
                ),
              );
            }'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              assert "key: ValueKey('free_gap_$r,$c')" in s, 'Capraz bos kare blogu bulunamadi'
          # Only replace the width setting for the free crossword, not the arrow board.
          old_width = re.compile(r'(?m)^(\s*): 660,[ \t]*$')
          if old_width.search(s):
              s = old_width.sub(r'\1: math.max(120.0, available.maxWidth - 8),', s, count=1)
          else:
              assert ': math.max(120.0, available.maxWidth - 8),' in s, 'Genislik siniri taninamadi'
          ui.write_text(s, encoding='utf-8')

          test = Path('test/cengel_regression_test.dart')
          s = test.read_text(encoding='utf-8')
          first = '          for (final p in panels[r]) {'
          last = '        final letters = <(int, int), String>{};'
          if first in s:
              assert s.count(first) == 1 and s.count(last) == 1, 'Panel testinin konumu belirsiz'
              start = s.index(first)
              finish = s.index(last, start)
              new_test = '''          // Gazete tarzinda her satir 8 esit hucreden olusur.
              expect(panels[r], hasLength(arrowSize));
              for (var c = 0; c < arrowSize; c++) {
                expect(panels[r][c], (c, 1, c));
              }
            }
          '''
              # The replaced region includes the old loop and the closing brace of the row loop.
              s = s[:start] + new_test + s[finish:]
          else:
              assert 'expect(panels[r], hasLength(arrowSize));' in s, 'Panel testi beklenmeyen bicimde degismis'
          test.write_text(s, encoding='utf-8')
          print('Cengel ve capraz gazete duzeni degisiklikleri hazir.')
          PY

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Bagimliliklari indir
        run: flutter pub get

      - name: Kod analizi
        run: flutter analyze

      - name: Testleri calistir
        run: flutter test

      - name: Degisiklikleri depoya kaydet
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/newspaper_components.dart lib/newspaper_ui.dart test/cengel_regression_test.dart
          if git diff --cached --quiet; then
            echo 'Degisecek dosya yok.'
          else
            git commit -m 'Fix newspaper crossword cell sizes and background'
            git push
          fi
