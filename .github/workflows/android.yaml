name: Android APK ve AAB
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DASH__SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android proje dosyalarını oluştur
        run: |
          flutter create --platforms=android --project-name bulmaca_gazetesi --org com.teknolojix .
          python tool/brand_android.py
          flutter pub get
      - name: Kod analizi
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: APK
        run: flutter build apk --release
      - name: AAB (test imzası)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: Bulmaca-Dunyasi-1.4.1-Android
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
